  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #243447;
      font-family:
        Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 55px 20px;
      background: #2c3e50;
      color: white;
      text-align: center;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 2.6rem;
    }

    header p {
      margin: 0;
      font-size: 1.15rem;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: 28px auto;
      padding: 32px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #2c3e50;
      color: white;
      font-size: 2.5rem;
      font-weight: bold;
    }

    section {
      margin-bottom: 30px;
    }

    section:last-child {
      margin-bottom: 0;
    }

    h2 {
      margin-top: 0;
      padding-bottom: 8px;
      border-bottom: 2px solid #e1e6eb;
      color: #2c3e50;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      margin: 8px 0;
      padding: 12px 15px;
      border-radius: 6px;
      background: #ecf0f1;
    }

    a {
      color: #1976b9;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      padding: 22px;
      background: #2c3e50;
      color: white;
      text-align: center;
    }

    footer p {
      margin: 0;
    }

    @media (max-width: 600px) {
      header {
        padding: 40px 15px;
      }

      header h1 {
        font-size: 2rem;
      }

      .container {
        padding: 22px;
      }
    }
  </style>
</head>
